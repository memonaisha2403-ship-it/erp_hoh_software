<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1b3a">
<title>H O H — Clothing Management System</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.11.6/JsBarcode.all.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--navy:#0b1b3a;--acc:#0891b2;--bg:#f3f5f8;--card:#fff;--line:#e3e8ef;--mut:#64748b;--ok:#16a34a;--warn:#d97706;--bad:#dc2626}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--navy)}
#app{display:flex;min-height:100vh}
aside{width:230px;background:var(--navy);color:#cbd5e1;padding:16px 10px;position:sticky;top:0;height:100vh;overflow:auto;flex:none}
aside h1{color:#fff;letter-spacing:6px;font-size:22px;margin:4px 10px 0}aside small{display:block;margin:0 10px 14px;color:#7c8db0}
aside a{display:block;padding:9px 12px;border-radius:8px;cursor:pointer;color:#cbd5e1;margin-bottom:2px}
aside a:hover{background:#16295a}aside a.on{background:var(--acc);color:#fff}
main{flex:1;padding:20px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:10px;flex-wrap:wrap}
.top h2{margin:0;font-size:22px}
.grid{display:grid;gap:12px}.k{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
.kpi b{display:block;font-size:21px;margin-top:4px}.kpi span{color:var(--mut);font-size:12px}
table{width:100%;border-collapse:collapse}th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.4px;background:#f8fafc}
.tw{overflow:auto;border:1px solid var(--line);border-radius:10px;background:#fff}
input,select,textarea{font:inherit;padding:8px 10px;border:1px solid #cbd5e1;border-radius:8px;background:#fff;color:var(--navy);width:100%}
input:focus,select:focus{outline:2px solid #67e8f9;border-color:var(--acc)}
button{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer;color:var(--navy)}
button.p{background:var(--acc);border-color:var(--acc);color:#fff}button.d{color:var(--bad)}button.s{padding:4px 9px;font-size:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{flex:1;min-width:110px}.row>button{flex:none}
.badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11px;font-weight:600}
.b-paid,.b-ok{background:#dcfce7;color:#166534}.b-partial,.b-warn{background:#fef3c7;color:#92400e}.b-unpaid,.b-bad,.b-overdue{background:#fee2e2;color:#991b1b}.b-refunded,.b-gray{background:#e2e8f0;color:#334155}
.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:flex-start;justify-content:center;padding:30px 10px;overflow:auto;z-index:50}
.modal>div.wide{max-width:1100px}
.modal>div{background:#fff;border-radius:12px;padding:18px;width:100%;max-width:760px}
.modal h3{margin-top:0}
label{font-size:12px;color:var(--mut);display:block;margin-bottom:3px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.bars{display:flex;align-items:flex-end;gap:10px;height:140px}.bars div{flex:1;text-align:center;font-size:11px;color:var(--mut)}
.bars i{display:block;background:var(--acc);border-radius:4px 4px 0 0;min-height:2px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:8px;z-index:99;display:none}
#toast.bad{background:var(--bad)}#toast.ok{background:var(--ok)}
.inv{width:420px;background:#fff;padding:20px;color:#0b1b3a;font-size:13px;margin:auto;border:1px solid #ddd}
.inv h1{letter-spacing:8px;text-align:center;margin:0}.inv .c{text-align:center;color:#64748b;font-size:12px}
.inv table th{background:#fff}.inv td,.inv th{padding:4px 3px;font-size:12px}
.b-vt{background:#e0f2fe;color:#075985}.vtile{cursor:pointer}.vtile:hover{border-color:var(--acc)}
.pth{width:34px;height:34px;object-fit:cover;border-radius:6px;vertical-align:middle;margin-right:6px;border:1px solid var(--line)}
.promo{margin-top:16px;padding:16px;border-radius:12px;background:linear-gradient(135deg,#0b1b3a,#16295a);color:#fff;text-align:center}
.promo h4{margin:0 0 10px;font-size:18px;letter-spacing:.5px}.pgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.pgrid>div{display:flex;flex-direction:column;align-items:center;gap:6px}.pgrid small{color:#9fb0d0}
.pbtn{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:99px;background:#fff;color:#0b1b3a;text-decoration:none;font-weight:600}.pbtn:hover{box-shadow:0 0 0 3px #67e8f955}
.promo-b{margin-top:10px;padding:8px;background:#fff;color:#0b1b3a;border:1px solid #ddd}.promo-b h4{font-size:13px;margin-bottom:6px}.promo-b .pgrid{gap:6px;grid-template-columns:1fr 1fr}.promo-b .pgrid small{color:#64748b}.promo-b .pbtn{border:1px solid #ddd;padding:5px 8px;font-size:11px}
.lbl{display:inline-block;border:1px dashed #aaa;padding:4px;margin:3px;text-align:center;font-size:10px;vertical-align:top;overflow:hidden;background:#fff}
.lbl svg{max-width:100%}.lbl .qr{display:flex;justify-content:center}
#printArea{display:none}
@media print{body>#app,#toast,.modal{display:none!important}#printArea{display:block!important}}
@media(max-width:800px){#app{flex-direction:column}aside{width:100%;height:auto;position:static;display:flex;flex-wrap:wrap;gap:2px}aside h1,aside small{width:100%}.two,.three{grid-template-columns:1fr}main{padding:12px}}
.pg{position:relative;overflow:hidden;background:#fff;box-sizing:border-box}
.lb{position:absolute;box-sizing:border-box;overflow:hidden;display:flex;flex-direction:column;align-items:stretch;font-family:Arial,Helvetica,sans-serif;color:#000;background:#fff}
.lb.q{flex-direction:row;align-items:center;gap:1.2mm}
.lb .ln{white-space:nowrap;overflow:hidden}.lb .bcw{display:flex;justify-content:center;align-items:center;overflow:hidden}
.lb .qrw{display:flex;align-items:center;justify-content:center;flex:none}.lb .qt{overflow:hidden;word-break:break-word}
.lb svg{display:block}.lb.test{border:0.25mm solid #000;background:#fff}
.prev .pg{box-shadow:0 0 0 .3mm #64748b;margin:0 0 2mm}.prev .lb{outline:.2mm dashed #0891b2;outline-offset:-.1mm}
.pgl{font:11px system-ui;color:#334155;margin:4px 0 1px}
@media print{#printArea .pg{page-break-after:always;break-after:page}#printArea .pg:last-child{page-break-after:auto;break-after:auto}}
.cstat{min-height:20px;font-size:12px;margin:4px 0}
.spin{display:inline-block;width:12px;height:12px;border:2px solid #cbd5e1;border-top-color:var(--acc);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}@keyframes sp{to{transform:rotate(360deg)}}
input.lk{background:#f1f5f9}
.lb.row{flex-direction:row;align-items:center;gap:1mm}
.lb .col{display:flex;flex-direction:column;justify-content:center;min-width:0;flex:1 1 auto;overflow:hidden}
.lb .wrapt{flex:1;overflow:hidden;word-break:break-word;min-width:0}
.pg .guide{position:absolute;border:.2mm dashed #f59e0b;pointer-events:none;box-sizing:border-box;background:#fff}
.prev .pg{background:#fde68a}
.lb.test .ct{font:2.6mm Arial,sans-serif;text-align:center;line-height:3.2mm}
.rl{position:relative;height:0;border-top:.35mm solid #000;margin:2mm auto 1mm}.rl i{position:absolute;top:-1.5mm;height:3mm;border-left:.3mm solid #000}
.sq{width:10mm;height:10mm;border:.3mm solid #000;margin:1mm auto}
</style>
</head>
<body>
<div id="app">
<aside id="nav"></aside>
<main id="main"></main>
</div>
<div id="toast"></div>
<div id="printArea"></div>
<script>
/* ===== Data layer ===== */
const KEY='hoh_erp_v1';
const REVKEY=KEY+'_rev';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const inr=n=>'₹'+(Math.round((+n||0)*100)/100).toLocaleString('en-IN',{minimumFractionDigits:0,maximumFractionDigits:2});
const today=()=>new Date().toISOString().slice(0,10);
const fdate=d=>new Date(d).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'});
const r2=n=>Math.round(n*100)/100;

const DEFMETHODS=['Cash','HDFC - 0462','SBI - 9732','BOI - 2323'];
const ARTRE=/^[A-Z0-9][A-Z0-9-]{1,11}$/;
const idKey=s=>String(s==null?'':s).trim().toUpperCase();
const cleanCode=s=>String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
function methods(){return(db.settings.methods&&db.settings.methods.length)?db.settings.methods:DEFMETHODS}
function methodOpts(selected,extra){const list=[...methods(),...(extra||[])];if(selected&&!list.includes(selected))list.push(selected);return list.map(m=>`<option ${m===selected?'selected':''}>${esc(m)}</option>`).join('')}

function ean13(base12){let s=0;for(let i=0;i<12;i++)s+=(+base12[i])*(i%2?3:1);return base12+((10-s%10)%10)}
function seed(){
  return{ver:2,settings:{name:'H O H',addr:'Main Road, Himatnagar, Gujarat',phone:'+91 90000 00000',wa:'919000000000',email:'hello@hoh.in',gst:5,gstin:'',prefix:'HOH',dueDays:7,low:5,pts100:1,refReward:50,ptValue:1,returnDays:15,allowNeg:false,methods:DEFMETHODS.slice()},
  products:[],customers:[],vendors:[],purchases:[],invoices:[],moves:[],docs:[],series:[],ctr:{inv:0,bc:0}}}

/* ---- identifiers: one namespace for every SKU and barcode (case-insensitive) ---- */
function usedIds(exceptPid){const s=new Set();for(const p of db.products){if(p.id===exceptPid)continue;for(const v of p.variants){if(v.sku)s.add(idKey(v.sku));if(v.barcode)s.add(idKey(v.barcode))}}return s}
function seriesById(id){return db.series.find(s=>s.id===id)||db.series[0]}
function seriesCode(s,n){
  if(s.kind==='ean13'){const w=12-s.prefix.length,num=String(n);if(w<1||num.length>w)return null;return ean13(s.prefix+num.padStart(w,'0'))}
  return s.prefix+String(n).padStart(s.pad||0,'0')}
function allocBarcode(sid,taken){const s=seriesById(sid),used=taken||usedIds();
  for(let g=0;g<200000;g++){const c=seriesCode(s,s.next);if(!c)throw new Error('Barcode series "'+s.name+'" is full — create a new series');s.next++;if(!used.has(idKey(c))){used.add(idKey(c));return c}}
  throw new Error('Could not allocate a barcode in series "'+s.name+'"')}
function suggestArticle(name,taken){let b=cleanCode(name).slice(0,3);if(b.length<2)b=(b+'XX').slice(0,2);let a=b,n=1;while(taken.has(a)){n++;a=b+n}return a}
function makeSku(article,size,color,taken,vt){const base=[article,cleanCode(size)||'NA',cleanCode(color).slice(0,3)||'NA',...(vt?[vtCode(vt)]:[])].join('-');let s=base,n=1;while(taken.has(idKey(s))){n++;s=base+'-'+n}taken.add(idKey(s));return s}

/* ---- v3: customer categories, vendor stock name, grid label settings, WhatsApp ---- */
const CATS=['A','B','C'];
const LEGACY_TYPES=['Regular','VIP'];
const DEFWA='Hello {customer},\nThank you for shopping at {store}.\nInvoice {invoice} ({date})\n{items}\nSubtotal: {subtotal}\n{discount_line}GST: {tax}\nTotal: {total}\nPaid: {paid}\n{balance_line}{store} · {phone}';
const DEFGREET='Hello {customer}, this is {store}.';
const VTS=['X','Y','Z','Z+'];
const vtCode=t=>t==='Z+'?'ZP':cleanCode(t);
const GROUP_URL='https://chat.whatsapp.com/E4jHxx6Q2Qg2pCdIAPYBgU?s=cl&p=a&mlu=4&ilr=4';
const IG_URL='https://www.instagram.com/outfit_faizan_autograph?dlrf=cXpxb2praHpyMWdk';
const DEFCONFIRM='Hello {customer},\nYour order {invoice} ({date}) is confirmed.\n{items}\nTotal: {total}\nPaid: {paid}\n{balance_line}Thank you for shopping at {store}!\n{store} · {phone}';
const DEFREMIND='Hello {customer},\nA friendly reminder: invoice {invoice} dated {date} has a balance of {balance} (total {total}, paid {paid}).\nPlease pay at your earliest convenience.\n{store} · {phone}';
const DEFPROD='Hello {customer},\n{product} ({article})\nPrice: {price}\nAvailable:\n{variants}\n{store} · {phone}';
const PAPERS={A4:[210,297],A5:[148,210]};
const LDEF={paper:'custom',paperW:104,paperH:40,orient:'landscape',cols:2,rows:1,labW:50,labH:38,gapX:2,gapY:0,mL:1,mR:1,mT:1,mB:1,offX:0,offY:0,pad:1,dpi:203,
  tmpl:'barcode',bctype:'Code128',bcW:0,bcH:0,qrW:0,qrH:0,brand:true,name:true,size:true,color:true,price:true,sku:true,fs:7,align:'center',copies:1,fill:false,zoom:2,preset:''};
const LKEYS=Object.keys(LDEF).filter(k=>k!=='zoom'&&k!=='preset');
function paperName(w,h){for(const k in PAPERS){const[a,b]=PAPERS[k];if((w===a&&h===b)||(w===b&&h===a))return k}return'custom'}
function lblFromOld(o){
  const g=(k,d)=>(o[k]!==''&&o[k]!=null&&Number.isFinite(+o[k]))?+o[k]:d;
  const n=Object.assign({},LDEF);
  n.paperW=g('pageW',104);n.paperH=g('pageH',27);n.cols=2;n.rows=1;
  n.labW=g('labW',50);n.labH=g('labH',25);n.gapX=g('gapX',2);n.gapY=0;
  n.mL=g('mL',1);n.mT=g('mT',1);
  n.mR=Math.max(0,Math.round((n.paperW-n.mL-2*n.labW-n.gapX)*100)/100);
  n.mB=Math.max(0,Math.round((n.paperH-n.mT-n.labH)*100)/100);
  n.offX=g('offX',0);n.offY=g('offY',0);n.pad=g('pad',1);n.dpi=g('dpi',203);
  n.tmpl=o.type==='QR'?'qr':'barcode';n.bctype=o.type==='EAN13'?'EAN13':'Code128';
  ['brand','name','size','price','sku','fill'].forEach(k=>{if(typeof o[k]==='boolean')n[k]=o[k]});
  if(typeof o.size==='boolean')n.color=o.size;
  n.zoom=g('zoom',2);n.orient=n.paperW>n.paperH?'landscape':'portrait';n.paper=paperName(n.paperW,n.paperH);
  return n}
function audit(action,detail){db.auditLog=db.auditLog||[];db.auditLog.push({date:new Date().toISOString(),action,detail:String(detail||'')});if(db.auditLog.length>500)db.auditLog.splice(0,db.auditLog.length-500)}
/* phone: keep what the user typed, match on a canonical form (India +91 / 0 / 00 prefixes ignored) */
function canonPhone(p){const raw=String(p||'').trim();let d=raw.replace(/\D/g,'');if(raw.startsWith('00'))d=d.slice(2);
  if(d.length===12&&d.startsWith('91'))return d.slice(2);
  if(d.length===13&&d.startsWith('091'))return d.slice(3);
  if(d.length===11&&d.startsWith('0'))return d.slice(1);
  return d}
let _cidx=null;
function custIndex(){if(_cidx)return _cidx;const m=new Map();db.customers.forEach(c=>{const k=canonPhone(c.phone);if(!k)return;if(!m.has(k))m.set(k,[]);m.get(k).push(c)});return _cidx=m}
function catLabels(){const l=(db.settings&&db.settings.catLabels)||{};return{A:l.A||'Customer A',B:l.B||'Customer B',C:l.C||'Customer C'}}
function catLabel(k){return catLabels()[k]||''}
function custCatName(c){return c.cat?catLabel(c.cat):('Unassigned'+(c.legacyType?' (was '+c.legacyType+')':''))}
function invCat(i){if(CATS.includes(i.cat))return i.cat;const m=((db.settings&&db.settings.catMap)||{})[i.ctype];if(CATS.includes(m))return m;return'legacy:'+(i.ctype||'')}
function catKeyName(k){if(CATS.includes(k))return catLabel(k);if(String(k).startsWith('legacy:'))return(k.slice(7)||'No category')+' (old, not mapped)';return String(k)}
const catBadge=k=>`<span class="badge ${CATS.includes(k)?'b-ok':'b-gray'}">${esc(catKeyName(k))}</span>`;
const catOpts=(sel,ph)=>`<option value="">${ph||'Select category…'}</option>`+CATS.map(k=>`<option value="${k}" ${sel===k?'selected':''}>${esc(catLabel(k))}</option>`).join('');
function catFilterOpts(sel){const keys=new Set(CATS);db.invoices.forEach(i=>keys.add(invCat(i)));
  return'<option value="">All categories</option>'+[...keys].map(k=>`<option value="${esc(k)}" ${sel===k?'selected':''}>${esc(catKeyName(k))}</option>`).join('')}
function migrate3(d,log){
  const s=d.settings,first=!(d.ver>=3);
  if(!s.catLabels)s.catLabels={A:'Customer A',B:'Customer B',C:'Customer C'};
  if(s.defaultCC==null)s.defaultCC='91';
  if(!s.waTemplate)s.waTemplate=DEFWA;
  if(!s.waGreeting)s.waGreeting=DEFGREET;
  if(s.lbl&&s.lbl.pageW!==undefined&&s.lbl.paperW===undefined)s.lbl=lblFromOld(s.lbl);
  s.lblProfiles=(s.lblProfiles||[]).map(p=>{if(p.pageW!==undefined&&p.paperW===undefined)return Object.assign(lblFromOld(p),{pname:String(p.name||'Saved layout'),name:true});if(p.pname===undefined)return Object.assign({},p,{pname:typeof p.name==='string'?p.name:'Saved layout',name:true});return p});
  d.auditLog=d.auditLog||[];
  if(s.lbl&&!s.lbl5038){s.lbl5038=true;const o=s.lbl;if(o.paperW===104&&o.paperH===27&&o.labW===50&&o.labH===25&&o.cols===2&&o.rows===1){o.paperH=40;o.labH=38;o.mB=1;o.mT=1;audit('Label size changed','Default sticker is now 50 × 38 mm (paper 104 × 40 mm, 2 across)')}}
  d.vendors.forEach(v=>{if(typeof v.stockName!=='string')v.stockName=''});
  let legacy=0;
  d.customers.forEach(c=>{
    if(c.cat===undefined){const t=c.type;c.legacyType=LEGACY_TYPES.includes(t)?t:'';c.cat=CATS.includes(t)?t:'';if(c.legacyType)legacy++}
    if(typeof c.city!=='string')c.city='';
    if(typeof c.legacyType!=='string')c.legacyType=''});
  d.invoices.forEach(i=>{if(i.cat===undefined)i.cat=CATS.includes(i.ctype)?i.ctype:'';if(typeof i.city!=='string')i.city=''});
  if(first&&(d.customers.length||d.invoices.length||d.vendors.length))audit('Upgrade to v3','Added vendor Stock Name, customer City and A/B/C categories, grid label settings, WhatsApp settings. '+legacy+' customer(s) keep their old Regular/VIP value and are Unassigned until an admin approves a mapping (Customers → Map old categories).')}

/* ---- migration: safe to run repeatedly; keeps all existing records ---- */
function migrate(){
  const d=db,log=[];
  d.ctr=d.ctr||{};d.ctr.inv=d.ctr.inv||0;d.ctr.bc=d.ctr.bc||0;
  ['products','customers','vendors','purchases','invoices','moves','docs','series'].forEach(k=>{if(!Array.isArray(d[k]))d[k]=[]});
  const s=d.settings=d.settings||{};if(s.low==null)s.low=5;
  if(!Array.isArray(s.methods)||!s.methods.length)s.methods=DEFMETHODS.slice();
  if(!Array.isArray(s.lblProfiles))s.lblProfiles=[];
  if(!d.series.length){let mx=d.ctr.bc||0;d.products.forEach(p=>(p.variants||[]).forEach(v=>{const b=String(v.barcode||'');if(/^8901\d{9}$/.test(b))mx=Math.max(mx,+b.slice(4,12))}));
    d.series.push({id:'s_main',name:'Main EAN-13 series',prefix:'8901',kind:'ean13',pad:8,next:mx+1})}
  const all=new Set(),seen=new Set(),arts=new Set();
  d.products.forEach(p=>(p.variants||[]).forEach(v=>{if(v.sku)all.add(idKey(v.sku));if(v.barcode)all.add(idKey(v.barcode))}));
  d.products.forEach(p=>{
    if(!Array.isArray(p.variants))p.variants=[];
    if(!d.series.some(x=>x.id===p.seriesId))p.seriesId=d.series[0].id;
    let a=String(p.article||'').toUpperCase().replace(/[^A-Z0-9-]/g,'');
    if(!ARTRE.test(a)||arts.has(a)){const na=suggestArticle(p.name,arts);if(p.article)log.push('Article '+p.article+' ("'+p.name+'") was duplicate/invalid → '+na);a=na}
    arts.add(a);p.article=a;
    p.variants.forEach(v=>{
      v.size=String(v.size==null?'':v.size).trim()||'Free';v.color=String(v.color==null?'':v.color).trim()||'NA';v.qty=+v.qty||0;if(v.min==null)v.min=s.low;v.vt=VTS.includes(v.vt)?v.vt:'';
      let sk=String(v.sku||'').trim();
      if(!sk||seen.has(idKey(sk))){const o=sk;sk=makeSku(a,v.size,v.color,all,v.vt);if(o)log.push('Duplicate SKU '+o+' → '+sk)}
      v.sku=sk;seen.add(idKey(sk));all.add(idKey(sk));
      let bc=String(v.barcode||'').trim();
      if(!bc||seen.has(idKey(bc))){const o=bc;bc=allocBarcode(p.seriesId,all);if(o)log.push('Duplicate barcode '+o+' → '+bc+' (reprint that label)')}
      v.barcode=bc;seen.add(idKey(bc));all.add(idKey(bc))})});
  d.customers.forEach(c=>{c.hist=c.hist||[];c.points=c.points||0});
  d.invoices.forEach(i=>{i.payments=i.payments||[];i.returns=i.returns||[];i.payments.forEach(p=>{if(!p.method)p.method='Cash'});
    if(!i.method)i.method=(i.payments.find(p=>p.amt>0)||i.payments[0]||{}).method||'Cash';});
  d.purchases.forEach(p=>{p.payments=p.payments||[]});
  if(log.length)d.migrationLog=(d.migrationLog||[]).concat(log.map(m=>({date:new Date().toISOString(),msg:m})));
  migrate3(d,log);migrate4(d);migrate5(d);d.ver=5;return log}
function migrate5(d){const first=!(d.ver>=5);if(!Array.isArray(d.held))d.held=[];d.ctr.hold=d.ctr.hold||0;if(d.rev==null)d.rev=0;
  const sk={};d.products.forEach(p=>p.variants.forEach(v=>sk[v.id]=v.sku));
  d.invoices.forEach(i=>i.items.forEach(l=>{if(l.sku===undefined&&sk[l.vid])l.sku=sk[l.vid]}));
  if(first&&(d.products.length||d.invoices.length))audit('Upgrade to v5','Added held bills (max 10), customer purchase summary and profile filters, PIN-protected profit analytics, and protection against two windows overwriting each other. Existing invoices, products, customers, vendors and barcode series were not changed.')}
function migrate4(d){const s=d.settings,first=!(d.ver>=4);
  if(!s.waConfirm)s.waConfirm=DEFCONFIRM;if(!s.waRemind)s.waRemind=DEFREMIND;if(!s.waProduct)s.waProduct=DEFPROD;if(s.waPromo==null)s.waPromo=true;

/* invoice maths */
function invCalc(items,invDisc){let sub=0,tax=0;items.forEach(i=>{const l=Math.max(0,i.qty*i.price-(i.disc||0));sub+=l;tax+=l*(i.gst||0)/100});
  invDisc=Math.min(+invDisc||0,sub);const f=sub?1-invDisc/sub:1;tax=tax*f;return{sub:r2(sub),disc:r2(invDisc),tax:r2(tax),total:r2(sub-invDisc+tax)}}
const paidOf=i=>r2(i.payments.reduce((a,p)=>a+p.amt,0));
const refundedOf=i=>r2((i.returns||[]).reduce((a,r)=>a+r.refund,0));
const retValueOf=i=>r2((i.returns||[]).reduce((a,r)=>a+(r.value||0),0));
const exAddOf=i=>r2((i.returns||[]).reduce((a,r)=>a+(r.exAdd||0),0));
function netTotal(i){return r2(i.total-retValueOf(i)+exAddOf(i))}
function balanceOf(i){return r2(Math.max(0,netTotal(i)-(paidOf(i)-refundedOf(i))))}
function statusOf(i){const net=netTotal(i);if(i.returns?.length&&net<=0)return'refunded';const b=balanceOf(i);if(b<=0.009)return'paid';
  const due=new Date(i.date);due.setDate(due.getDate()+db.settings.dueDays);if(new Date()>due)return'overdue';return paidOf(i)>0?'partial':'unpaid'}
const badge=s=>`<span class="badge b-${s}">${s==='partial'?'Partially Paid':s[0].toUpperCase()+s.slice(1)}</span>`;
const vendorDue=v=>r2(db.purchases.filter(p=>p.vendorId===v).reduce((a,p)=>a+p.total-p.payments.reduce((x,y)=>x+y.amt,0),0));
const custDue=()=>r2(db.invoices.reduce((a,i)=>a+balanceOf(i),0));

  const clean=(v,qty)=>({id:v.id,sku:v.sku,size:v.size,color:v.color,vt:v.vt||'',barcode:v.barcode,qty,min:Math.max(0,+v.min||0)});

function parseCSV(t){const rows=[];let r=[],c='',q=false;for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch=='"'&&t[i+1]=='"'){c+='"';i++}else if(ch=='"')q=false;else c+=ch}else if(ch=='"')q=true;else if(ch==','){r.push(c);c=''}else if(ch=='\n'||ch=='\r'){if(ch=='\r'&&t[i+1]=='\n')i++;r.push(c);c='';if(r.some(x=>x))rows.push(r);r=[]}else c+=ch}if(c||r.length){r.push(c);rows.push(r)}return rows}
function doImport(){const f=$('#impf').files[0];if(!f)return toast('Choose a file','bad');const rd=new FileReader();rd.onload=()=>{const rows=parseCSV(rd.result),h=rows.shift().map(x=>x.trim().toLowerCase());const ix=k=>h.indexOf(k);

    if(p.variants.some(v=>v.size.toLowerCase()===size.toLowerCase()&&v.color.toLowerCase()===color.toLowerCase()&&(v.vt||'')===vt)){skip++;return}
    const v={id:uid(),sku:makeSku(p.article,size,color,used,vt),size,color,vt,barcode:allocBarcode(p.seriesId,used),qty,min:db.settings.low};p.variants.push(v);if(qty)db.moves.push({date:new Date().toISOString(),vid:v.id,qty,type:'Opening',reason:'CSV import',user:'admin'});n++})}
  catch(e){return toast(e.message,'bad')}

/* ---- sale: validates everything first, then writes customer + invoice + payment + stock + points together (rolls back on any error) ---- */
let posTxn='';
function makeSale(o){
  const name=String(o.name||'').trim(),phone=String(o.phone||'').trim(),city=String(o.city||'').trim(),canon=canonPhone(phone);
  if(o.txn){const x=db.invoices.find(i=>i.txn===o.txn);if(x)return{err:'This bill was already saved as '+x.no+' — it was not saved twice',dup:x}}
  if(canon.length<7||canon.length>15)return{err:'Enter a valid contact number (7–15 digits)'};
  let cust=null;const matches=custIndex().get(canon)||[];
  if(o.custId){cust=db.customers.find(c=>c.id===o.custId);if(!cust)return{err:'The selected customer no longer exists — re-enter the number'}}
  else if(!o.forceNew){if(matches.length===1)cust=matches[0];else if(matches.length>1)return{err:'Several customers share this number — choose one in the customer box first'}}
  if(!cust&&!name)return{err:'Customer name is required'};
  if(!CATS.includes(o.cat))return{err:'Select the customer category (Customer A / B / C)'};
  if(!o.items||!o.items.length)return{err:'No items in the bill'};
  if(!methods().includes(o.method))return{err:'Select a payment method'};
  const need={};
  for(const l of o.items){if(!Number.isFinite(l.qty)||l.qty<1)return{err:'Invalid quantity'};need[l.vid]=(need[l.vid]||0)+l.qty}
  for(const vid in need){const v=findV(vid);if(!v)return{err:'A product in this bill no longer exists'};if(v.qty<need[vid]&&!db.settings.allowNeg)return{err:'Insufficient stock: '+vname(v)+' (available '+v.qty+')'}}
  const c=o.calc||invCalc(o.items,o.disc);
  if(!(c.total>0))return{err:'Bill total must be more than 0'};
  const paid=o.paid==null?c.total:+o.paid;
  if(!(paid>=0))return{err:'Invalid amount paid'};if(paid>c.total+0.001)return{err:'Paid amount exceeds the total'};
  const snap={c:JSON.stringify(db.customers),p:JSON.stringify(db.products),ctr:JSON.stringify(db.ctr),mv:db.moves.length,iv:db.invoices.length};
  try{

/* per product × variant figures, all calculated from the stock ledger (db.moves) */
function invRows(f){
  const from=f.from?new Date(f.from+'T00:00:00').getTime():null,to=f.to?new Date(f.to+'T23:59:59.999').getTime():null;
  const mv={};db.moves.forEach(m=>{(mv[m.vid]=mv[m.vid]||[]).push(m)});
  const g={};
  db.products.forEach(p=>{if(f.pid?p.id!==f.pid:p.status==='archived')return;
    p.variants.forEach(v=>{const vt=v.vt||'';
      if(f.vt&&(f.vt==='__none'?vt!=='':vt!==f.vt))return;
      let pre=v.qty;const b={open:0,buy:0,sold:0,ret:0,adj:0};let rng=0;

        if(a)pre-=m.qty;if(a&&e){rng+=m.qty;b[mvKind(m)]+=m.qty}});
      const close=pre+rng,open=pre+b.open,k=p.id+'|'+vt;
      const r=g[k]=g[k]||{p,vt,open:0,buy:0,sold:0,ret:0,adj:0,close:0,low:0,out:0,skus:0};
      r.open+=open;r.buy+=b.buy;r.sold+=-b.sold;r.ret+=b.ret;r.adj+=b.adj;r.close+=close;r.skus++;
      if(close<=0)r.out++;else if(close<=(v.min??db.settings.low))r.low++});});

  const ord=t=>t===''?9:VTS.indexOf(t);

async function camScan(){if(!('BarcodeDetector' in window)||!navigator.mediaDevices)return toast('Camera scanning is not supported by this browser — use a USB/Bluetooth scanner or type the code','bad');
  let stream;try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}})}catch(e){return toast('Camera permission denied or no camera found','bad')}
  modal(`<h3>Scan with camera</h3><video id="cv" playsinline muted style="width:100%;border-radius:10px;background:#000"></video><p style="color:var(--mut);font-size:12px">Point at a barcode or QR label.</p><p style="text-align:right"><button onclick="camStop()">Close</button></p>`);
  const vd=$('#cv');vd.srcObject=stream;await vd.play().catch(()=>{});window._cam={stream,on:true};
  let det;try{det=new BarcodeDetector({formats:['code_128','ean_13','qr_code']})}catch(e){camStop();return toast('Scanner could not start','bad')}
  const tick=async()=>{if(!window._cam||!window._cam.on)return;try{const r=await det.detect(vd);if(r.length){const code=r[0].rawValue;if(scanFind(code)){camStop();scanOpen(code);return}}}catch(e){}setTimeout(tick,300)};tick()}

/* ===== Vendors & purchases ===== */
let vq='';

const vPlain=v=>v.name+(v.stockName?' ('+v.stockName+')':'');
function vendorRows(){const q=vq.trim().toLowerCase();
  const list=db.vendors.filter(v=>!q||(v.name+' '+(v.stockName||'')+' '+(v.contact||'')+' '+(v.phone||'')+' '+(v.email||'')+' '+(v.addr||'')+' '+(v.gstin||'')).toLowerCase().includes(q));
  return list.map(v=>`<tr><td><b>${esc(v.name)}</b></td><td>${v.stockName?esc(v.stockName):'<span style="color:var(--mut)">—</span>'}</td><td>${esc(v.contact)} ${esc(v.phone)}</td><td>${inr(db.purchases.filter(p=>p.vendorId===v.id).reduce((a,p)=>a+p.total,0))}</td><td><b style="color:${vendorDue(v.id)>0?'var(--bad)':'var(--ok)'}">${inr(vendorDue(v.id))}</b></td><td style="white-space:nowrap"><button class="s" onclick="vendorView('${v.id}')">Details</button> <button class="s" onclick="vendorLedger('${v.id}')">Ledger</button> <button class="s" onclick="vendorForm('${v.id}')">Edit</button></td></tr>`).join('')||`<tr><td colspan=6>${db.vendors.length?'No vendor matches your search':'No vendors'}</td></tr>`}
function drawVendors(){const t=$('#vtbody');if(t)t.innerHTML=vendorRows()}
R.ven=()=>{act(`<button class="p" onclick="vendorForm()">+ Vendor</button> <button onclick="purchaseForm()">+ Purchase / Receive stock</button>`);
  body(`<div class="row" style="margin-bottom:8px"><input id="vqi" placeholder="Search vendor, stock name, contact, phone…" value="${esc(vq)}" oninput="vq=this.value;drawVendors()"></div>
  <div class="tw"><table><thead><tr><th>Vendor</th><th>Stock Name</th><th>Contact</th><th>Purchases</th><th>Outstanding</th><th></th></tr></thead><tbody id="vtbody">${vendorRows()}</tbody></table></div>
  <h3>Purchases</h3><div class="tw"><table><tr><th>Date</th><th>Vendor</th><th>Bill ref</th><th>Total</th><th>Paid</th><th>Due</th><th></th></tr>${db.purchases.slice().reverse().map(p=>{const pd=p.payments.reduce((a,x)=>a+x.amt,0);const v=db.vendors.find(x=>x.id===p.vendorId);return`<tr><td>${fdate(p.date)}</td><td>${v?vLabel(v):'—'}</td><td>${esc(p.ref)}</td><td>${inr(p.total)}</td><td>${inr(pd)}</td><td>${inr(p.total-pd)}</td><td>${p.total-pd>0?`<button class="s" onclick="vendorPay('${p.id}')">Pay</button>`:badge('paid')}</td></tr>`}).join('')||'<tr><td colspan=7>No purchases</td></tr>'}</table></div>`)};
const VFIELDS=[['name','Vendor name *'],['stockName','Stock Name'],['contact','Contact person'],['phone','Phone'],['email','Email'],['addr','Address'],['gstin','GSTIN']];
function vendorForm(id){const v=id?db.vendors.find(x=>x.id===id):{name:'',stockName:'',contact:'',phone:'',email:'',addr:'',gstin:''};
  modal(`<h3>${id?'Edit':'Add'} vendor</h3><div class="two">${VFIELDS.map(([k,l])=>`<div><label>${l}</label><input id="v_${k}" value="${esc(v[k]||'')}" ${k==='stockName'?'maxlength="100" placeholder="e.g. Cotton shirts"':''}></div>`).join('')}</div><p style="text-align:right"><button onclick="closeModal()">Cancel</button> <button class="p" onclick="saveVendor('${id||''}')">Save</button></p>`)}
function saveVendor(id){const d={};VFIELDS.forEach(([k])=>d[k]=$('#v_'+k).value.trim());
  if(!d.name)return toast('Vendor name is required','bad');
  if(d.name.length>100||d.stockName.length>100)return toast('Vendor name and Stock Name can be at most 100 characters','bad');
  if(d.email&&!/^\S+@\S+\.\S+$/.test(d.email))return toast('Enter a valid email or leave it empty','bad');
  const key=x=>(x.name+'|'+(x.stockName||'')).toLowerCase();
  if(db.vendors.some(x=>x.id!==id&&key(x)===key(d)))return toast('A vendor with this name and Stock Name already exists — edit that one instead','bad');
  if(id){const o=db.vendors.find(x=>x.id===id);if((o.stockName||'')!==d.stockName)audit('Vendor Stock Name changed',o.name+': "'+(o.stockName||'')+'" → "'+d.stockName+'"');Object.assign(o,d)}
  else{db.vendors.push({id:uid(),...d});audit('Vendor added',vPlain(d))}
  save();closeModal();toast('Vendor saved','ok');R.ven()}
function vendorView(id){const v=db.vendors.find(x=>x.id===id),ps=db.purchases.filter(p=>p.vendorId===id),tot=ps.reduce((a,p)=>a+p.total,0),paid=ps.reduce((a,p)=>a+p.payments.reduce((x,y)=>x+y.amt,0),0);
  modal(`<h3>${esc(v.name)}</h3><table>${VFIELDS.map(([k,l])=>`<tr><td style="color:var(--mut);width:140px">${l.replace(' *','')}</td><td>${esc(v[k])||'<span style="color:var(--mut)">—</span>'}</td></tr>`).join('')}<tr><td style="color:var(--mut)">Purchases</td><td>${ps.length} · ${inr(tot)}</td></tr><tr><td style="color:var(--mut)">Paid</td><td>${inr(paid)}</td></tr><tr><td style="color:var(--mut)">Outstanding</td><td><b>${inr(vendorDue(id))}</b></td></tr></table>
  <p style="text-align:right"><button onclick="vendorLedger('${id}')">Ledger</button> <button onclick="vendorForm('${id}')">Edit</button> <button onclick="closeModal()">Close</button></p>`)}
let pLines=[];
function purchaseForm(){pLines=[];modal(`<h3>Purchase / receive stock</h3><div class="three"><div><label>Vendor *</label><select id="pu_v">${db.vendors.map(v=>`<option value="${v.id}">${esc(vPlain(v))}</option>`).join('')}</select></div><div><label>Supplier bill no.</label><input id="pu_r"></div><div><label>Date</label><input id="pu_d" type="date" value="${today()}"></div></div>
  <div class="row" style="margin-top:10px"><select id="pu_i" style="flex:3">${variantList().map(v=>`<option value="${v.id}">${esc(vname(v))} [${v.qty}]</option>`).join('')}</select><input id="pu_q" type="number" placeholder="Qty" value="10"><input id="pu_c" type="number" placeholder="Unit cost"><button onclick="addPLine()">Add</button></div><div id="pl"></div>
  <div class="two"><div><label>Paid now</label><input id="pu_p" type="number" value="0"></div><div><label>Method</label><select id="pu_m">${methodOpts('')}</select></div></div>
  <p style="text-align:right"><button onclick="closeModal()">Cancel</button> <button class="p" onclick="savePurchase()">Receive & save</button></p>`);
  $('#pu_i').onchange=()=>{$('#pu_c').value=pinOK()?findV($('#pu_i').value).p.cost:''};$('#pu_c').value=pinOK()?(findV($('#pu_i').value)?.p.cost||''):''}
function addPLine(){const vid=$('#pu_i').value,q=+$('#pu_q').value,c=+$('#pu_c').value;if(q<=0||c<0||$('#pu_c').value==='')return toast('Enter a valid quantity and unit cost','bad');pLines.push({vid,qty:q,cost:c});drawPL()}
function drawPL(){$('#pl').innerHTML=`<table>${pLines.map((l,i)=>`<tr><td>${esc(vname(findV(l.vid)))}</td><td>${l.qty} × ${inr(l.cost)}</td><td>${inr(l.qty*l.cost)}</td><td><button class="s d" onclick="pLines.splice(${i},1);drawPL()">×</button></td></tr>`).join('')}<tr><td colspan=2><b>Total</b></td><td colspan=2><b>${inr(pLines.reduce((a,l)=>a+l.qty*l.cost,0))}</b></td></tr></table>`}
function savePurchase(){if(!pLines.length)return toast('Add items','bad');const total=r2(pLines.reduce((a,l)=>a+l.qty*l.cost,0)),paid=+$('#pu_p').value||0;if(paid>total)return toast('Paid exceeds total','bad');
  const p={id:uid(),date:$('#pu_d').value,vendorId:$('#pu_v').value,ref:$('#pu_r').value,items:pLines,total,payments:paid?[{date:new Date().toISOString(),amt:paid,method:$('#pu_m').value}]:[]};
  pLines.forEach(l=>{moveStock(l.vid,l.qty,'Purchase',p.ref||'Purchase');const v=findV(l.vid);v.p.cost=l.cost});db.purchases.push(p);save();closeModal();toast('Stock received','ok');R.ven()}
function vendorPay(id){const p=db.purchases.find(x=>x.id===id),due=r2(p.total-p.payments.reduce((a,x)=>a+x.amt,0));modal(`<h3>Vendor payment</h3><p>Due: <b>${inr(due)}</b></p><div class="two"><div><label>Amount</label><input id="vp_a" type="number" value="${due}"></div><div><label>Method</label><select id="vp_m">${methodOpts('')}</select></div></div><p style="text-align:right"><button onclick="closeModal()">Cancel</button> <button class="p" onclick="doVendorPay('${id}')">Record</button></p>`)}
function doVendorPay(id){const p=db.purchases.find(x=>x.id===id),due=r2(p.total-p.payments.reduce((a,x)=>a+x.amt,0)),a=+$('#vp_a').value;if(a<=0||a>due+0.001)return toast('Invalid amount','bad');p.payments.push({date:new Date().toISOString(),amt:a,method:$('#vp_m').value});save();closeModal();toast('Payment recorded','ok');go(cur)}
function vendorLedger(id){const v=db.vendors.find(x=>x.id===id);let bal=0;const rows=[];db.purchases.filter(p=>p.vendorId===id).forEach(p=>{rows.push([p.date,'Purchase '+p.ref,p.total,0]);p.payments.forEach(x=>rows.push([x.date.slice(0,10),'Payment ('+x.method+')',0,x.amt]))});rows.sort((a,b)=>a[0]<b[0]?-1:1);
  modal(`<h3>${esc(v.name)}${v.stockName?' <small style="color:var(--mut)">('+esc(v.stockName)+')</small>':''} — ledger</h3><table><tr><th>Date</th><th>Entry</th><th>Debit</th><th>Credit</th><th>Balance</th></tr>${rows.map(r=>{bal+=r[2]-r[3];return`<tr><td>${fdate(r[0])}</td><td>${esc(r[1])}</td><td>${r[2]?inr(r[2]):''}</td><td>${r[3]?inr(r[3]):''}</td><td>${inr(bal)}</td></tr>`}).join('')}</table><p style="text-align:right"><button onclick="closeModal()">Close</button></p>`)}

/* ===== Payments & dues ===== */
R.pay=()=>{const inv=db.invoices.slice().reverse();
  act(`<button onclick="exportInvoices()">Export CSV</button>`);

function doReturn(id){const i=db.invoices.find(x=>x.id===id);const days=(Date.now()-new Date(i.date))/864e5;if(days>db.settings.returnDays&&!$('#r_ov')?.checked)return toast('Outside return window — authorise override','bad');
  const cond=$('#r_c').value,pick=[],dr=i.sub?i.disc/i.sub:0;let value=0;
  i.items.forEach((l,k)=>{const q=+$('#rq_'+k).value||0;if(!q)return;if(q>l.qty-(l.rq||0)){pick.push({err:1});return}const ex=$('#rx_'+k).value;const unit=Math.max(0,l.qty*l.price-l.disc)/l.qty;const taxf=1+(l.gst||0)/100*(1-dr);pick.push({k,q,ex,val:unit*q*(1-dr)*taxf})});
  if(pick.some(p=>p.err))return toast('Excessive return quantity','bad');if(!pick.length)return toast('Select items','bad');
  const need={};pick.forEach(p=>{if(p.ex)need[p.ex]=(need[p.ex]||0)+p.q});
  for(const v in need){const ev=findV(v);if(!ev||(ev.qty<need[v]&&!db.settings.allowNeg))return toast('Exchange stock unavailable: '+(ev?vname(ev):'item'),'bad')}
  const now=new Date().toISOString(),desc=[],lines=[],ex=[];let credit=0,owe=0,exAdd=0;
  pick.forEach(p=>{const l=i.items[p.k];l.rq=(l.rq||0)+p.q;value+=p.val;desc.push(p.q+'× '+l.name+' '+l.size);lines.push({k:p.k,q:p.q});
    if(cond==='Resaleable')moveStock(l.vid,p.q,'Return','Return '+i.no);else db.moves.push({date:now,vid:l.vid,qty:0,type:'Return-'+cond,reason:p.q+' pcs held out of stock ('+i.no+')',user:'admin'});
    if(p.ex){const ev=findV(p.ex);moveStock(p.ex,-p.q,'Exchange','Exchange '+i.no);const nv=ev.p.price*p.q*(1+ev.p.gst/100);exAdd+=nv;
      ex.push({vid:p.ex,pid:ev.p.id,name:ev.p.name,size:ev.size,q:p.q,price:ev.p.price,gst:ev.p.gst,cost:ev.p.cost});desc.push('→ '+vname(ev));const d=nv-p.val;if(d<0)credit+=-d;else owe+=d}
    else credit+=p.val});

  const gross=inv.reduce((a,i)=>a+i.total,0),ret=inv.reduce((a,i)=>a+retValueOf(i)-exAddOf(i),0),collected=inv.reduce((a,i)=>a+paidOf(i)-refundedOf(i),0),recv=inv.reduce((a,i)=>a+balanceOf(i),0),tax=inv.reduce((a,i)=>a+i.tax,0),disc=inv.reduce((a,i)=>a+i.disc+i.items.reduce((x,l)=>x+l.disc,0),0);

  body(`<div class="row" style="margin-bottom:10px"><div><label>From</label><input type="date" id="rf" value="${f}" onchange="R.rep()"></div><div><label>To</label><input type="date" id="rt" value="${t}" onchange="R.rep()"></div><div><label>Payment method</label><select id="rm" onchange="R.rep()"><option value="">All methods</option>${used.map(m=>`<option ${m===mf?'selected':''}>${esc(m)}</option>`).join('')}</select></div><div><label>Customer category</label><select id="rc" onchange="R.rep()">${catFilterOpts(tf)}</select></div></div>

  <div class="card" style="margin-top:12px"><b>Payment method summary</b><div class="tw" style="margin-top:6px"><table><tr><th>Method</th><th>Bills (chosen at billing)</th><th>Net bill value</th><th>Payments</th><th>Received</th><th>Refunded</th><th>Net received</th></tr>${Object.entries(mt).filter(([m,r])=>methods().includes(m)||r.bills||r.n).map(([m,r])=>`<tr><td>${esc(m)}</td><td>${r.bills}</td><td>${inr(r.val)}</td><td>${r.n}</td><td>${inr(r.rec)}</td><td>${inr(r.ref)}</td><td><b>${inr(r.rec-r.ref)}</b></td></tr>`).join('')}</table></div></div>
  <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(300px,1fr));margin-top:12px">

  ${pinOK()?`<div class="card"><b>Stock by classification (cost value)</b><table>${Object.entries(cls).map(r=>`<tr><td>${r[0]}</td><td>${r[1].q} pcs</td><td>${inr(r[1].v)}</td></tr>`).join('')}</table></div>`:lockTile('Stock by classification (cost value)')}

function exportReport(){download('sales.csv',csv([['Invoice','Date','Customer','City','Customer category','Payment method','Subtotal','Discount','GST','Total','Returns','Paid','Balance','Status'],...db.invoices.map(i=>[i.no,i.date.slice(0,10),i.name,i.city||'',catKeyName(invCat(i)),methodLabel(i),i.sub,i.disc,i.tax,i.total,retValueOf(i),paidOf(i)-refundedOf(i),balanceOf(i),statusOf(i)])]),'text/csv')}

/* ---- Barcode series UI ---- */
function seriesCard(){return`<div class="card" style="margin-bottom:12px"><div class="row"><b style="flex:none">Barcode series</b><span style="color:var(--mut)">Each article uses one series. Codes are issued in order and never repeat.</span><button class="s p" style="flex:none" onclick="seriesForm()">+ New series</button></div>
  <div class="tw" style="margin-top:8px"><table><tr><th>Series</th><th>Type</th><th>Prefix</th><th>Next code</th><th>Articles</th><th>Codes used</th><th></th></tr>${db.series.map(s=>{const ps=db.products.filter(p=>p.seriesId===s.id),n=ps.reduce((a,p)=>a+p.variants.length,0);let nx=seriesCode(s,s.next);return`<tr><td><b>${esc(s.name)}</b></td><td>${s.kind==='ean13'?'EAN-13 (numeric)':'Code 128 (alphanumeric)'}</td><td><code>${esc(s.prefix)}</code></td><td>${nx?`<code>${esc(nx)}</code>`:'<span class="badge b-bad">full</span>'}</td><td>${ps.length}</td><td>${n}</td><td style="white-space:nowrap"><button class="s" onclick="seriesForm('${s.id}')">Edit</button> <button class="s" onclick="selSeries('${s.id}')">Select labels</button> <button class="s d" onclick="delSeries('${s.id}')">Delete</button></td></tr>`}).join('')}</table></div></div>`}
function seriesForm(id){const s=id?seriesById(id):{name:'',kind:'ean13',prefix:'',pad:6,next:1},used=id?db.products.filter(p=>p.seriesId===id).reduce((a,p)=>a+p.variants.length,0):0,lock=used>0?'disabled':'';
  modal(`<h3>${id?'Edit':'New'} barcode series</h3><div class="two"><div><label>Series name *</label><input id="sr_n" value="${esc(s.name)}" placeholder="e.g. Shirts 2026"></div>
  <div><label>Type</label><select id="sr_k" ${lock} onchange="srHint()"><option value="ean13" ${s.kind==='ean13'?'selected':''}>EAN-13 (digits, check digit)</option><option value="code128" ${s.kind==='code128'?'selected':''}>Code 128 (letters + digits)</option></select></div>
  <div><label>Prefix</label><input id="sr_p" value="${esc(s.prefix)}" ${lock} oninput="srHint()" placeholder="EAN: 1–8 digits · Code128: e.g. HOH"></div>
  <div><label>Number width (Code 128)</label><input id="sr_w" type="number" min="1" max="8" value="${s.pad}" ${lock} oninput="srHint()"></div>
  <div><label>Next number</label><input id="sr_x" type="number" min="1" value="${s.next}" oninput="srHint()"></div></div>
  <p id="sr_h" style="color:var(--mut)"></p>${used?'<p style="color:var(--mut);font-size:12px">Type, prefix and width are locked because this series already has '+used+' codes.</p>':''}
  <p style="text-align:right"><button onclick="closeModal()">Cancel</button> <button class="p" onclick="saveSeries('${id||''}')">Save</button></p>`);srHint()}
function srTmp(){return{kind:$('#sr_k').value,prefix:$('#sr_p').value.trim().toUpperCase(),pad:+$('#sr_w').value||1,next:Math.floor(+$('#sr_x').value)||1}}
function srHint(){const s=srTmp(),c=seriesCode(s,s.next);$('#sr_h').innerHTML='Example next code: '+(c?'<b><code>'+esc(c)+'</code></b>':'<span style="color:var(--bad)">invalid — number too long for the prefix</span>')}
function saveSeries(id){const n=$('#sr_n').value.trim(),s=srTmp();if(!n)return toast('Series name required','bad');
  if(db.series.some(x=>x.id!==id&&x.name.toLowerCase()===n.toLowerCase()))return toast('A series with this name exists','bad');
  if(s.kind==='ean13'){if(!/^\d{1,8}$/.test(s.prefix))return toast('EAN-13 prefix must be 1–8 digits','bad')}else if(!/^[A-Z0-9-]{0,12}$/.test(s.prefix))return toast('Prefix: letters, digits, hyphen (max 12)','bad');
  if(s.pad<1||s.pad>8)return toast('Number width must be 1–8','bad');if(!seriesCode(s,s.next))return toast('Next number does not fit this prefix','bad');
  if(db.series.some(x=>x.id!==id&&x.kind===s.kind&&x.prefix===s.prefix))return toast('Another series already uses this prefix','bad');
  if(id){const o=seriesById(id);o.name=n;o.next=s.next;if(!db.products.some(p=>p.seriesId===id)){o.kind=s.kind;o.prefix=s.prefix;o.pad=s.pad}}
  else db.series.push({id:'s_'+uid(),name:n,...s});save();closeModal();toast('Series saved','ok');R.bar()}
function delSeries(id){if(db.series.length<2)return toast('Keep at least one series','bad');if(db.products.some(p=>p.seriesId===id))return toast('Series is used by articles — move them to another series first','bad');db.series=db.series.filter(s=>s.id!==id);save();R.bar()}
function selSeries(sid){document.querySelectorAll('#bt tr[data-ser]').forEach(r=>{if(r.dataset.ser===sid){sel[r.dataset.v]=sel[r.dataset.v]||1;r.querySelector('input[type=checkbox]').checked=true}});barPrev();toast('Series selected for labels','ok')}

/* ---- Payment methods + integrity check (Settings) ---- */
function methodsCard(){return`<div class="card"><b>Payment methods</b><p style="color:var(--mut);margin:6px 0">One per line. Used in billing, receipts, purchases and refunds. Older transactions keep the method they were saved with.</p><textarea id="s_methods" rows="5">${esc(methods().join('\n'))}</textarea><p><button class="p" onclick="saveMethods()">Save methods</button> <button onclick="$('#s_methods').value=DEFMETHODS.join('\\n')">Reset to default</button></p></div>`}
function saveMethods(){const seen=new Set(),list=[];$('#s_methods').value.split('\n').map(x=>x.trim()).filter(Boolean).forEach(m=>{if(!seen.has(m.toLowerCase())){seen.add(m.toLowerCase());list.push(m)}});if(!list.length)return toast('Add at least one payment method','bad');db.settings.methods=list;save();toast('Payment methods saved','ok');R.set()}
function integrity(){const out=[],ids=new Map(),arts=new Map();
  db.products.forEach(p=>{if(arts.has(p.article))out.push('Duplicate article code '+p.article+' ('+p.name+' / '+arts.get(p.article)+')');else arts.set(p.article,p.name);
    p.variants.forEach(v=>{const who=p.name+' '+v.size+'/'+v.color;[['SKU',v.sku],['Barcode',v.barcode]].forEach(([k,x])=>{const key=idKey(x);if(!key){out.push(k+' missing: '+who);return}if(ids.has(key))out.push('Duplicate '+k+' '+x+': '+who+' and '+ids.get(key));else ids.set(key,who)});if(v.vt&&!VTS.includes(v.vt))out.push('Invalid variant '+v.vt+': '+who);if(v.qty<0)out.push('Negative stock: '+who+' ('+v.qty+')')})});
  const sum={};db.moves.forEach(m=>sum[m.vid]=(sum[m.vid]||0)+m.qty);
  db.products.forEach(p=>p.variants.forEach(v=>{if((sum[v.id]||0)!==v.qty)out.push('Stock ledger mismatch: '+p.name+' '+v.size+'/'+v.color+' — shelf '+v.qty+', ledger '+(sum[v.id]||0))}));
  db.invoices.forEach(i=>{i.items.forEach(l=>{if(!findV(l.vid))out.push('Invoice '+i.no+' refers to a deleted product variant')});if(paidOf(i)-refundedOf(i)>netTotal(i)+0.01)out.push('Invoice '+i.no+' is overpaid')});
  return out}
function integrityCard(){return`<div class="card"><b>Data integrity</b><p style="color:var(--mut);margin:6px 0">Checks that every SKU and barcode is unique, stock matches the movement ledger, and bills link to real products.</p><div class="row"><button onclick="runIntegrity()">Run check</button><button onclick="repairIntegrity()">Repair duplicates & ledger</button></div><div id="intres" style="margin-top:8px"></div>${(db.migrationLog||[]).length?`<p style="color:var(--mut);font-size:12px;margin:8px 0 0">Automatic fixes made when your data was upgraded:<br>${db.migrationLog.slice(-5).map(m=>esc(m.msg)).join('<br>')}</p>`:''}</div>`}
function runIntegrity(){const r=integrity();$('#intres').innerHTML=r.length?r.slice(0,30).map(x=>`<div class="badge b-warn" style="display:block;margin:3px 0;white-space:normal">${esc(x)}</div>`).join('')+(r.length>30?'<small>…and '+(r.length-30)+' more</small>':''):'<div class="badge b-ok">All checks passed ✓</div>'}
function repairIntegrity(){const log=migrate(),sum={};db.moves.forEach(m=>sum[m.vid]=(sum[m.vid]||0)+m.qty);let n=0;
  db.products.forEach(p=>p.variants.forEach(v=>{const d=v.qty-(sum[v.id]||0);if(d){db.moves.push({date:new Date().toISOString(),vid:v.id,qty:d,type:'Reconcile',reason:'Ledger reconcile',user:'admin'});n++}}));
  save();R.set();runIntegrity();toast((log.length+n)?'Repaired '+log.length+' identifier(s) and '+n+' ledger line(s)':'Nothing to repair','ok')}

  <div class="card"><b>Backup & data</b><p style="color:var(--mut)">Data lives in this browser. Back it up regularly — backups contain cost prices, so store them safely.</p><div class="row"><button onclick="download('hoh-backup-'+today()+'.json',JSON.stringify(db),'application/json')">Backup</button><button onclick="$('#rest').click()">Restore</button><input type="file" id="rest" accept=".json" style="display:none" onchange="restore(this.files[0])"></div><p><button class="d" onclick="if(confirm('Delete ALL data?')){db=seed();save();location.reload()}">Reset (empty)</button></p></div></div>`)};
function saveSettings(){const s=db.settings;['name','addr','phone','wa','email','gstin','prefix'].forEach(k=>s[k]=$('#s_'+k).value);['gst','dueDays','low','returnDays','pts100','refReward','ptValue'].forEach(k=>s[k]=+$('#s_'+k).value);s.allowNeg=$('#s_allowNeg').value==='true';save();toast('Saved','ok')}
function restore(f){const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.products||!d.settings)throw 0;db=d;migrate();save();location.reload()}catch(e){toast('Invalid backup file','bad')}};r.readAsText(f)}
function installApp(){if(deferredInstall){deferredInstall.prompt()}else toast('Use browser menu → Install / Add to Home screen')}
async function camScan(){if(!('BarcodeDetector'in window))return toast('Camera scanning not supported in this browser','bad');
  try{const st=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});modal(`<video id="cv" autoplay playsinline style="width:100%;border-radius:8px"></video><p id="cr">Point at barcode / QR…</p><p style="text-align:right"><button onclick="stopCam()">Close</button></p>`);window._st=st;$('#cv').srcObject=st;const det=new BarcodeDetector();
    window._ct=setInterval(async()=>{try{const r=await det.detect($('#cv'));if(r.length){const c=r[0].rawValue;stopCam();if(cur==='pos'){$('#scan').value=c;scanKey({key:'Enter',target:$('#scan'),preventDefault(){}})}else toast('Scanned: '+c,'ok')}}catch(e){}},400)}catch(e){toast('Camera permission denied','bad')}}
function stopCam(){clearInterval(window._ct);window._st&&window._st.getTracks().forEach(t=>t.stop());closeModal()}

/* ===== PWA manifest (inline) ===== */
(function(){const ic='data:image/svg+xml;utf8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" rx="90" fill="#0b1b3a"/><text x="256" y="320" font-size="190" font-family="Arial" font-weight="700" fill="#22d3ee" text-anchor="middle">HOH</text></svg>');
  const m={name:'H O H Clothing ERP',short_name:'H O H',start_url:'.',display:'standalone',background_color:'#ffffff',theme_color:'#0b1b3a',icons:[{src:ic,sizes:'512x512',type:'image/svg+xml'}]};
  const l=document.createElement('link');l.rel='manifest';l.href=URL.createObjectURL(new Blob([JSON.stringify(m)],{type:'application/manifest+json'}));document.head.appendChild(l);
  const f=document.createElement('link');f.rel='icon';f.href=ic;document.head.appendChild(f)})();
window.addEventListener('online',()=>toast('Back online','ok'));window.addEventListener('offline',()=>toast('You are offline — data is saved locally','bad'));
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
go('dash');
if(_mlog.length)setTimeout(()=>toast('Data upgraded: '+_mlog.length+' duplicate code(s) fixed — see Settings → Data integrity'),700);
</script>
